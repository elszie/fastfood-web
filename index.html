<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickCrave</title>
<style>
:root{--bg:#fdf3df;--card:#fff8ea;--acc:#e8731a;--acc2:#c85a0a;--tx:#3b2a1a;--mut:#8a7560;--bd:#ecd9b5}
*{box-sizing:border-box;margin:0;font-family:Poppins,system-ui,sans-serif}
body{background:var(--bg);color:var(--tx)}
a{color:inherit;text-decoration:none;cursor:pointer}
h1,h2,h3{line-height:1.2}
.logo{font-weight:800;font-size:22px;color:var(--acc)}
.top{display:flex;align-items:center;gap:24px;padding:14px 48px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.top nav{display:flex;gap:24px;margin-left:auto;align-items:center}
.top nav a:hover,.side a.on{color:var(--acc);font-weight:600}
.btn{background:var(--acc);color:#fff;border:0;padding:10px 22px;border-radius:999px;font-weight:600;cursor:pointer;font-size:14px}
.btn:hover{background:var(--acc2)}.btn.o{background:transparent;color:var(--acc);border:2px solid var(--acc)}
.wrap{max-width:1100px;margin:auto;padding:40px 24px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;min-height:70vh}
.tag{color:var(--acc);font-weight:700;letter-spacing:2px;font-size:13px}
.hero h1{font-size:44px;margin:12px 0}.hero p{color:var(--mut);margin-bottom:12px}
.big{font-size:180px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;margin-top:24px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px}
.item .em{font-size:64px;text-align:center;background:var(--bg);border-radius:14px;padding:10px;position:relative}
.item h3{margin:10px 0 4px}.item p{color:var(--mut);font-size:13px;min-height:54px}
.item .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-weight:700}
.heart{position:absolute;right:8px;top:6px;font-size:20px;cursor:pointer;color:#bbb}.heart.on{color:#e03131}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.chip{padding:8px 18px;border-radius:999px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:14px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
input,select,textarea{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:12px;background:#fff;font-size:14px;margin:6px 0 12px}
label{font-size:13px;font-weight:600}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:28px;text-align:center}
.num{width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;margin:0 auto 10px;font-weight:700}
.auth{max-width:400px;margin:60px auto}.auth h2{margin-bottom:6px}.auth .btn{width:100%;margin-top:6px}
.center{text-align:center;color:var(--mut);font-size:14px;margin-top:14px}.center a{color:var(--acc);font-weight:600}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--bd);padding:20px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.side a{padding:9px 12px;border-radius:10px}.side a:hover{background:var(--bg)}
.side .sp{flex:1}
.main{padding:32px 40px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar input{max-width:320px;margin:0}
.track{display:flex;gap:6px;margin:12px 0;font-size:12px}
.track span{flex:1;text-align:center;padding:6px 2px;border-radius:8px;background:var(--bg);color:var(--mut)}
.track span.on{background:var(--acc);color:#fff;font-weight:600}
.line{display:flex;justify-content:space-between;padding:6px 0}
.tot{font-weight:800;border-top:1px dashed var(--bd);margin-top:6px;padding-top:10px}
.qty{display:flex;gap:10px;align-items:center}.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--acc);background:#fff;cursor:pointer}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:24px}
.faq{cursor:pointer;margin-bottom:12px}.faq p{display:none;color:var(--mut);margin-top:8px;font-size:14px}.faq.open p{display:block}
.pill{background:var(--acc);color:#fff;font-size:11px;padding:2px 10px;border-radius:999px;margin-left:8px}
footer{background:#3b2a1a;color:#f5e6c8;padding:32px 48px;margin-top:40px;display:flex;gap:40px;flex-wrap:wrap;font-size:14px}
footer div{display:flex;flex-direction:column;gap:6px}footer b{color:#fff}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 20px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none}
#toast.on{opacity:1}

.logo{color:#e8261a}
.app{grid-template-columns:200px 1fr}
.side{background:#f8e3b8;border:0;padding:22px 16px;gap:10px}
.side .logo{font-size:20px;margin-bottom:18px}
.side a{padding:10px 14px;border-radius:999px;text-align:center;font-size:14px}
.side a:hover{background:#f1d19a}
.side a.on{background:#d9a05b;color:#fff;font-weight:600}
.side .prof{display:flex;align-items:center;gap:10px;text-align:left;padding:8px;border-radius:12px}
.side .prof span{display:flex;flex-direction:column;line-height:1.2}.side .prof small{font-size:10px;color:var(--mut)}
.av{width:22px;height:22px;border-radius:50%;background:#d9a05b;flex:none}
.side .out{background:#d9a05b;color:#fff;font-weight:600;cursor:pointer}
.dots{display:flex;justify-content:space-around;margin-top:14px;font-size:12px}
.dots div{display:flex;flex-direction:column;align-items:center;gap:6px;opacity:.45}.dots div.on{opacity:1;font-weight:600}
.dots i{width:22px;height:22px;border-radius:50%}
.soc{display:flex;justify-content:center;gap:18px;margin:16px 0 4px}
.soc span{width:46px;height:46px;border-radius:12px;background:#f8e3b8;display:grid;place-items:center;font-weight:800;font-size:22px}
.cc{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
.cc span{flex:1;min-width:110px;text-align:center;padding:14px;border-radius:12px;background:#f8e3b8;font-weight:600;cursor:pointer}
@media(max-width:800px){.hero,.two,.steps{grid-template-columns:1fr}.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.top{padding:12px 16px}.main{padding:20px 16px}.big{font-size:100px}}
</style>
</head>
<body>
<div id="root"></div><div id="toast"></div>
<script>
const MENU=[
{id:1,n:'Hotsilog',c:'Rice Bowl',d:'Garlic fried rice with hotdog and sunny-side-up egg.',p:70,e:'🍳'},
{id:2,n:'Baconsilog',c:'Rice Bowl',d:'Garlic fried rice with crispy bacon and sunny-side-up egg.',p:95,e:'🥓'},
{id:3,n:'Chicken Rice Bowl',c:'Rice Bowl',d:'Steamed rice with crispy chicken, egg, and sauce.',p:120,e:'🍗'},
{id:4,n:'Bangsilog',c:'Rice Bowl',d:'Garlic fried rice with crispy fried bangus and sunny-side-up egg.',p:90,e:'🐟'},
{id:5,n:'Mango',c:'Juice/Drinks',d:'Fresh, sweet mango juice, 16 oz.',p:60,e:'🥭'},
{id:6,n:'Orange',c:'Juice/Drinks',d:'Fresh, squeezed orange juice, 16 oz.',p:60,e:'🍊'},
{id:7,n:'Pineapple',c:'Juice/Drinks',d:'Sweet and tangy pineapple juice, 16 oz.',p:60,e:'🍍'},
{id:8,n:'Grape',c:'Juice/Drinks',d:'Rich, sweet grape juice, 16 oz.',p:60,e:'🍇'},
{id:9,n:'Beef Burger',c:'Burgers',d:'Juicy beef patty with fresh lettuce, tomato and cheese.',p:80,e:'🍔'},
{id:10,n:'Cheese Burger',c:'Burgers',d:'Classic beef patty with melted cheese, lettuce, and tomato.',p:90,e:'🍔'},
{id:11,n:'Double Cheese Burger',c:'Burgers',d:'Two juicy beef patties with lettuce, tomato, and cheese.',p:110,e:'🍔'},
{id:12,n:'Chicken Burger',c:'Burgers',d:'Crispy fried chicken fillet with lettuce and creamy mayo.',p:85,e:'🍔'},
{id:13,n:'Barbecue Fries',c:'Fries',d:'Golden crispy fries tossed in smoky barbecue seasoning.',p:50,e:'🍟'},
{id:14,n:'Cheese Fries',c:'Fries',d:'Golden crispy fries topped with creamy cheese powder.',p:50,e:'🍟'},
{id:15,n:'Chili Cheese Fries',c:'Fries',d:'Crispy fries topped with cheese and flavorful chili.',p:60,e:'🍟'},
{id:16,n:'Sour Cream Fries',c:'Fries',d:'Golden crispy fries served with creamy sour dip.',p:50,e:'🍟'}];
const CATS=['All','Rice Bowl','Juice/Drinks','Burgers','Fries'];
const STAT=['Received','Preparing','On the way','Delivered'];
const DEF={user:null,cart:{},favs:[],addrs:[{l:'Home',a:'Brgy. Tuburan, E.B Magalona',d:1},{l:'Office',a:'Commercial',d:0}],orders:[{id:'QC-0001',t:'Today, 9:12 AM',s:2,items:[[1,1]],total:120,pay:'Cash on delivery',to:'Street, barangay, city'}]};
let S;try{S=JSON.parse(localStorage.getItem('qc'))||DEF}catch(e){S=DEF}
const save=()=>{try{localStorage.setItem('qc',JSON.stringify(S))}catch(e){}};
let cat='All',q='';
const $=s=>document.querySelector(s),item=id=>MENU.find(m=>m.id==id);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1500)};
const go=h=>{location.hash=h};
const cartCount=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
const sub=()=>Object.entries(S.cart).reduce((a,[i,n])=>a+item(i).p*n,0);

const footer=`<footer><div><b>Quick Crave</b>Real food from local kitchens, delivered fast enough to satisfy the craving.</div><div><b>Explore</b><a href="#/">Home</a><a href="#/menu">Menu</a><a href="#/how">How it Works</a><a href="#/about">About Us</a></div><div><b>Help</b><a>FAQs</a><a>Track Order</a><a>Contact</a><a>Allergens</a></div><div><b>Hot drops, zero spam.</b>Get new menu launches and local offers in your inbox.<input placeholder="Email address"></div><div style="width:100%;font-size:12px">© 2026 Quick Crave. Made for hungry people. · Privacy · Terms · Accessibility</div></footer>`;

function pub(r,body){return `<div class="top"><a class="logo" href="#/">QuickCrave</a><nav>${[['','Home'],['menu','Menu'],['how','How it works'],['about','About us']].map(([h,t])=>`<a href="#/${h}" class="${r==h?'on':''}" style="${r==h?'color:var(--acc);font-weight:600':''}">${t}</a>`).join('')}<a href="#/login">Log in</a><a class="btn" href="#/signup">Sign up</a></nav></div>${body}${footer}`}
function app(r,body){const L=[['home','Home'],['menu','Menu'],['cart',`Cart${cartCount()?`<span class="pill">${cartCount()}</span>`:''}`],['orders','My orders'],['favorites','Favorites'],['addresses','Addresses'],['help','Help']];
return `<div class="app"><aside class="side"><a class="logo" href="#/home" style="margin-bottom:14px">QuickCrave</a>${L.map(([h,t])=>`<a href="#/${h}" class="${r==h?'on':''}">${t}</a>`).join('')}<div class="sp"></div><a href="#/profile" class="prof ${r=='profile'?'on':''}"><i class="av"></i><span><b>${S.user.name}</b><small>My profile</small></span></a><a class="out" data-act="logout">Log Out</a></aside><div class="main">${body}</div></div>`}

function itemCard(m){return `<div class="card item"><div class="em">${m.e}<span class="heart ${S.favs.includes(m.id)?'on':''}" data-act="fav" data-id="${m.id}">♥</span></div><h3>${m.n}</h3><p>${m.d}</p><div class="row">₱ ${m.p}<button class="btn" data-act="add" data-id="${m.id}">Add</button></div></div>`}
function menuBody(){const list=MENU.filter(m=>(cat=='All'||m.c==cat)&&m.n.toLowerCase().includes(q.toLowerCase()));
return `<h1>Our Menu</h1><p style="color:var(--mut)">Pick your favorite. Ready in 5-20 mins.</p><div class="bar" style="margin-top:14px"><input id="search" placeholder="Search for food..." value="${q}"></div><div class="chips">${CATS.map(c=>`<span class="chip ${c==cat?'on':''}" data-act="cat" data-c="${c}">${c}</span>`).join('')}</div><div class="grid" id="mgrid">${list.map(itemCard).join('')||'<p>No results.</p>'}</div>`}
function orderCard(o){return `<div class="card"><div class="line"><b>Order #${o.id}</b><span style="color:var(--acc);font-weight:600">${STAT[o.s]}</span></div><small style="color:var(--mut)">${o.t}</small><div class="track">${STAT.map((s,i)=>`<span class="${i<=o.s?'on':''}">${s}</span>`).join('')}</div>${o.items.map(([i,n])=>`<div class="line"><span>${n}x ${item(i).n}</span><span>₱${item(i).p*n}</span></div>`).join('')}<div class="line tot"><span>Total</span><span>₱${o.total}</span></div><small style="color:var(--mut)">Payment: ${o.pay}<br>Deliver to: ${o.to}</small><br><button class="btn o" style="margin-top:10px" data-act="again" data-id="${o.id}">Order again</button></div>`}

const P={
'':()=>pub('',`<div class="wrap hero"><div><span class="tag">SERVED IN 5-20 MINS</span><h1>QuickCrave is designed to conquer the time crunch of short lunch breaks.</h1><p>No missing meals or wasting your breaks, just quick reliable ordering when you need it most.</p><a class="btn" href="#/menu">Order now</a> <a class="btn o" href="#/how">How it works</a></div><div class="big">🍔</div></div>`),
menu:()=>S.user?app('menu',menuBody()):pub('menu',`<div class="wrap">${menuBody()}</div>`),
how:()=>pub('how',`<div class="wrap" style="text-align:center"><span class="tag">HOW IT WORKS</span><h1 style="margin:8px 0">3 Steps to Order</h1><p style="color:var(--mut)">From craving to first bite in minutes.</p><div class="steps">${[['Choose your food','Pick your favorite food & drink from our menu.'],['Order and Pay','Place your order and pay at the counter.'],['Pick Up and Enjoy','Get your freshly prepared order and enjoy!']].map(([t,d],i)=>`<div class="card"><div class="num">${i+1}</div><h3>${t}</h3><p style="color:var(--mut)">${d}</p></div>`).join('')}</div></div>`),
about:()=>pub('about',`<div class="wrap" style="max-width:760px"><span class="tag">ABOUT US</span><h1 style="margin:8px 0">Good food shouldn't eat up your break.</h1><p>QuickCrave is built for busy people with short lunch breaks. We make ordering fast, simple, and reliable, so you can spend your break eating instead of waiting.</p><div class="card" style="margin-top:24px"><h2>Our Story</h2><p style="margin-top:8px;color:var(--mut)">We noticed that lunch breaks are short, lines are long, and meals often go missing. QuickCrave was made to fix that with a menu of favorites, simple ordering, and food served in 5–20 mins. Every order is freshly prepared by local kitchens, so it's quick without being a compromise.</p></div><div class="center"><h3>Ready to skip the wait?</h3><br><a class="btn" href="#/menu">Start</a></div></div>`),
login:()=>pub('login',`<div class="card auth"><h2>Welcome back!</h2><p style="color:var(--mut);margin-bottom:16px">Log in to order in seconds</p><label>Email</label><input id="em" type="email"><label>Password</label><input id="pw" type="password"><label style="font-weight:400"><input type="checkbox" style="width:auto;margin:0 6px 0 0">Remember me</label><button class="btn" data-act="login">Log in</button><div class="soc"><span style="color:#1877f2">f</span><span style="color:#d6249f">◎</span><span style="color:#ea4335">G</span></div><p class="center">or<br>Don't have an account? <a href="#/signup">Sign up</a></p></div>`),
signup:()=>pub('signup',`<div class="card auth"><h2>Sign up</h2><br><label>Full Name</label><input id="nm"><label>Email</label><input id="em" type="email"><label>Password</label><input id="pw" type="password"><button class="btn" data-act="signup">Sign Up</button><div class="soc"><span style="color:#1877f2">f</span><span style="color:#d6249f">◎</span><span style="color:#ea4335">G</span></div><p class="center">or<br>Already have an account? <a href="#/login">Sign in</a></p></div>`),
home:()=>app('home',`<h1>Good morning, ${S.user.name}</h1><p style="color:var(--mut)">What are you craving today?</p>${S.orders.find(o=>o.s<3)?`<div class="card" style="margin:20px 0;background:#f8e3b8"><b>Your food is on the way</b><div class="dots">${STAT.map((t,i)=>`<div class="${i<=S.orders[0].s?'on':''}"><i style="background:${['#6b7280','#f59e0b','#3b82f6','#10b981'][i]}"></i>${t}</div>`).join('')}</div></div>`:''}<h2>Categories</h2><div class="chips">${CATS.slice(1).map(c=>`<span class="chip" data-act="gocat" data-c="${c}">${c}</span>`).join('')}</div><h2>Order again</h2><div class="grid">${MENU.filter((m,i)=>[0,7,11,12].includes(i)).map(itemCard).join('')}</div>`),
cart:()=>{const ids=Object.keys(S.cart);const a=S.addrs.find(x=>x.d)||S.addrs[0];
return app('cart',`<h1>Checkout</h1>${ids.length?`<div class="two" style="margin-top:20px"><div class="card"><h3>Delivery details</h3><br><label>Full name</label><input id="fn" value="${S.user.name}"><label>Phone number</label><input id="ph"><label>Street, barangay, city</label><input id="ad" value="${a?a.a:''}"><label>Delivery notes</label><textarea id="nt" rows="2"></textarea><h3>Payment method</h3><br>${['Cash on delivery','GCash','Card'].map((p,i)=>`<label style="display:block;font-weight:400"><input type="radio" name="pay" value="${p}" ${i?'':'checked'} style="width:auto;margin:0 8px 0 0">${p}</label>`).join('')}</div><div class="card"><h3>Order summary</h3><br>${ids.map(i=>`<div class="line"><span>${item(i).n}</span><span class="qty"><button data-act="dec" data-id="${i}">-</button>${S.cart[i]}<button data-act="inc" data-id="${i}">+</button></span><span>₱${item(i).p*S.cart[i]}</span></div>`).join('')}<div class="line"><span>Subtotal</span><span>₱${sub()}</span></div><div class="line"><span>Delivery fee</span><span>₱50</span></div><div class="line tot"><span>Total</span><span>₱ ${sub()+50}</span></div><button class="btn" style="width:100%;margin-top:14px" data-act="place">Place order</button></div></div>`:`<p style="margin:20px 0;color:var(--mut)">Your cart is empty.</p><a class="btn" href="#/menu">Browse menu</a>`}`)},
orders:()=>app('orders',`<h1>My orders</h1><p style="color:var(--mut)">Track current orders and reorder past ones.</p><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">${S.orders.map(orderCard).join('')}</div>`),
favorites:()=>app('favorites',`<h1>Favorites</h1><p style="color:var(--mut)">${S.favs.length} saved</p><div class="grid">${MENU.filter(m=>S.favs.includes(m.id)).map(itemCard).join('')||'<p>Tap ♥ on a menu item to save it.</p>'}</div>`),
addresses:()=>app('addresses',`<h1>Where should we deliver?</h1><div class="two" style="margin-top:20px"><div>${S.addrs.map((a,i)=>`<div class="card" style="margin-bottom:12px"><b>${a.l}</b>${a.d?'<span class="pill">Default</span>':''}<p style="color:var(--mut)">${a.a}</p><a style="color:var(--acc)" data-act="rmaddr" data-id="${i}">Remove</a>${a.d?'':` · <a style="color:var(--acc)" data-act="defaddr" data-id="${i}">Make default</a>`}</div>`).join('')}</div><div class="card"><h3>Add addresses</h3><br><label>Label (Home, Office)</label><input id="al"><label>Street, city</label><input id="aa"><button class="btn" data-act="addaddr">Save address</button></div></div>`),
help:()=>app('help',`<h1>Help</h1><p style="color:var(--mut);margin-bottom:20px">Answers to common questions</p>${[['How do I track my order?','Go to My orders to see live status.'],['Can I change my order after placing it?','Contact support quickly, before it starts preparing.'],['How do I reorder a past meal?','Open My orders and tap Order again.'],['How do I change my delivery address?','Go to Addresses and add or set a default.']].map(([t,a])=>`<div class="card faq" data-act="faq"><b>${t}</b><span style="float:right">+</span><p>${a}</p></div>`).join('')}<div class="card"><h3>Still need help?</h3><p>support@quickcrave67.com<br>Daily 8 AM to 10 PM</p></div>`),
profile:()=>app('profile',`<h1>My profile</h1><p style="color:var(--mut);margin-bottom:20px">Your details for delivery updates</p><div class="card" style="max-width:420px"><div class="num" style="width:64px;height:64px;font-size:26px">${S.user.name[0].toUpperCase()}</div><label>Name</label><input id="pn" value="${S.user.name}"><label>Phone</label><input id="pp" value="${S.user.phone||''}" placeholder="09..."><label>Email</label><input id="pe" value="${S.user.email}"><button class="btn" data-act="saveprof">Save changes</button></div>`)
};
const PRIV=['home','cart','orders','favorites','addresses','help','profile'];
function render(){let r=location.hash.replace('#/','');if(!P[r])r='';
if(PRIV.includes(r)&&!S.user)return go('/login');
$('#root').innerHTML=P[r]();window.scrollTo(0,0)}
addEventListener('hashchange',render);

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=t.dataset.id,v=s=>($('#'+s)||{}).value||'';
const need=()=>{if(!S.user){toast('Please log in first');go('/login');return true}};
if(a=='cat'){cat=t.dataset.c;return render()}
if(a=='gocat'){cat=t.dataset.c;return go('/menu')}
if(a=='add'){if(need())return;S.cart[id]=(S.cart[id]||0)+1;save();toast('Added to cart');return render()}
if(a=='fav'){if(need())return;const i=S.favs.indexOf(+id);i<0?S.favs.push(+id):S.favs.splice(i,1);save();return render()}
if(a=='inc'||a=='dec'){S.cart[id]+=a=='inc'?1:-1;if(S.cart[id]<1)delete S.cart[id];save();return render()}
if(a=='login'){if(!v('em')||!v('pw'))return toast('Enter email and password');const n=S.user&&S.user.email==v('em')?S.user.name:v('em').split('@')[0];S.user={name:n[0].toUpperCase()+n.slice(1),email:v('em')};save();return go('/home')}
if(a=='signup'){if(!v('nm')||!v('em')||!v('pw'))return toast('Fill in all fields');S.user={name:v('nm'),email:v('em')};save();return go('/home')}
if(a=='logout'){S.user=null;save();return go('/')}
if(a=='place'){const o={id:'QC-'+String(S.orders.length+1).padStart(4,'0'),t:'Today, '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),s:0,items:Object.entries(S.cart).map(([i,n])=>[+i,n]),total:sub()+50,pay:(document.querySelector('[name=pay]:checked')||{}).value,to:v('ad')||'—'};S.orders.unshift(o);S.cart={};save();toast('Order placed!');return go('/orders')}
if(a=='again'){S.orders.find(o=>o.id==id).items.forEach(([i,n])=>S.cart[i]=(S.cart[i]||0)+n);save();return go('/cart')}
if(a=='addaddr'){if(!v('al')||!v('aa'))return toast('Fill both fields');S.addrs.push({l:v('al'),a:v('aa'),d:0});save();return render()}
if(a=='rmaddr'){S.addrs.splice(id,1);save();return render()}
if(a=='defaddr'){S.addrs.forEach((x,i)=>x.d=i==id?1:0);save();return render()}
if(a=='faq')return t.classList.toggle('open');
if(a=='saveprof'){S.user={name:v('pn')||S.user.name,phone:v('pp'),email:v('pe')};save();toast('Saved');return render()}
});
document.addEventListener('input',e=>{if(e.target.id=='search'){q=e.target.value;const p=e.target.selectionStart;render();const s=$('#search');s.focus();s.setSelectionRange(p,p)}});
render();
</script>
</body>
</html>
